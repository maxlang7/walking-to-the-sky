<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walking to the Sky in ASCII</title>
<meta name="description" content="A 3D night scene of Walking to the Sky at Carnegie Mellon, rendered in ASCII.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  footer {
    position: fixed; left: 0; right: 0; bottom: 6px; text-align: center;
    font: 11px ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    color: #3a3a44; pointer-events: none;
  }
  footer a { color: #55556a; pointer-events: auto; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<footer>Walking to the Sky, CMU &middot; after <a href="https://www.instagram.com/reels/DeLB9wtxJYI/">@ascii_and_pixels</a></footer>
<script>
'use strict';
// A small 3D ray caster whose framebuffer is a grid of characters.
// World units are metres, y is up, the pole stands at the origin and the camera mostly looks toward -z.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const GW = 96, GH = 106, NC = GW * GH, LOOP = 18;
const params = new URLSearchParams(location.search);
const FREEZE = params.has('t') ? parseFloat(params.get('t')) : null;

let W, H, CW, CH;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let h = innerHeight, w = h * 9 / 16;
  if (w > innerWidth) { w = innerWidth; h = w * 16 / 9; }
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  W = cv.width = Math.round(w * dpr); H = cv.height = Math.round(h * dpr);
  CW = W / GW; CH = H / GH;
}
addEventListener('resize', resize); resize();

const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
let seed = 11;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const mix = (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];

// ---------- scene ----------
const spheres = [], capsules = [], boxes = [], casters = [], lamps = [];
const capsule = (a, b, r, col, ch = null, fl = 0) => {
  const ba = sub(b, a), c = { a, b, r, col, ch, fl, bx: ba[0], by: ba[1], bz: ba[2], baba: dot(ba, ba) };
  capsules.push(c); return c;
};
const STEEL = [150, 170, 198], IRON = [110, 112, 126], AMBER = [255, 190, 96], SKIN = [225, 190, 160], JEANS = [70, 82, 120];
const CLOTHES = [[214, 84, 70], [232, 190, 80], [90, 140, 220], [120, 190, 120], [200, 120, 200], [230, 140, 70], [110, 190, 200]];

// the pole: 30 m of steel leaning 75 degrees
const TILT = 75 * Math.PI / 180, PD = [Math.cos(TILT), Math.sin(TILT), 0], PN = [-Math.sin(TILT), Math.cos(TILT), 0];
const POLE_R = .32, POLE_LEN = 30;
casters.push(capsule([0, 0, 0], add([0, 0, 0], PD, POLE_LEN), POLE_R, STEEL, '#', 1));

function figure(P, up, fwd, h, col, phase, fl) {
  const side = cross(up, fwd), hip = add(P, up, .5 * h), sh = add(P, up, .82 * h);
  capsule(hip, add(add(P, fwd, .17 * h * phase), side, .07 * h), .055 * h, JEANS, null, fl);
  capsule(hip, add(add(P, fwd, -.17 * h * phase), side, -.07 * h), .055 * h, JEANS, null, fl);
  const torso = capsule(hip, sh, .11 * h, col, '#', fl);
  for (const k of [1, -1]) {
    const s = add(sh, side, .15 * h * k);
    capsule(s, add(add(s, up, -.3 * h), fwd, -.15 * h * phase * k), .04 * h, col, null, fl);
  }
  spheres.push({ c: add(P, up, .94 * h), r: .1 * h, col: SKIN, ch: 'o', fl });
  return torso;
}
// seven figures walk up the pole, standing perpendicular to it
for (let k = 0; k < 7; k++) figure(add(add([0, 0, 0], PD, 9.5 + k * 3.1), PN, POLE_R), PN, PD, 2.6, CLOTHES[k], k % 2 ? 1 : -1, 1);
// three more watch from the lawn
[[-4.6, 1.6], [-6.2, -.6], [-3.9, -2.8]].forEach(([x, z], k) =>
  casters.push(figure([x, 0, z], [0, 1, 0], norm([-x, 0, -z]), 2.2, CLOTHES[(k + 3) % 7], .35, .8)));

// lamps along the walkway; lamps[0] is the hero lamp and the only one that casts shadows
const pathZ = x => (6 - .3 * x) / .954;
[-9, 13, 35, -31].forEach(x => {
  const z = pathZ(x) - 2.6, top = [x, 8, z], tip = [x + 1.7, 8.7, z];
  capsule([x, 0, z], top, .16, IRON, '#'); capsule(top, tip, .13, IRON, '#');
  boxes.push({ mn: [x + .9, 8.35, z - .55], mx: [x + 3.5, 8.95, z + .55], kind: 1, col: IRON });
  boxes.push({ mn: [x + 1.15, 7.85, z - .42], mx: [x + 3.25, 8.35, z + .42], kind: 2, col: AMBER });
  lamps.push([x + 2.2, 7.75, z]);
});

// bare trees
function branch(a, dir, len, r, depth) {
  const c = capsule(a, add(a, dir, len), r, [64, 54, 50]);
  for (let k = 0; depth > 0 && k < 3; k++)
    branch(add(a, dir, len * (.55 + .45 * rnd())), norm([dir[0] * .7 + (rnd() - .5) * 1.3, dir[1] * .7 + .3 + rnd() * .3, dir[2] * .7 + (rnd() - .5) * 1.3]), len * .66, r * .6, depth - 1);
  return c;
}
[[-19, -9], [13, -13], [22, 9], [-26, 13], [5, -26], [-12, -28], [34, -18]].forEach(([x, z]) => casters.push(branch([x, 0, z], [0, 1, 0], 3.2 + rnd() * 1.6, .28, 2)));

// Oakland behind Forbes Avenue
for (let x = -170; x < 170;) {
  const w = 10 + rnd() * 16, h = 9 + rnd() * 26, z = -66 - rnd() * 34 - Math.abs(x) * .12;
  boxes.push({ mn: [x, 0, z - 14], mx: [x + w, h, z], kind: 0, col: rnd() < .2 ? [26, 52, 56] : [34, 31, 46], seed: rnd() * 99, p: .1 + rnd() * .25 });
  x += w + rnd() * 5;
}
for (const sx of [-1, 1]) for (let z = -50; z < 30; z += 26) {
  const x = sx * (78 + rnd() * 22), w = 16;
  boxes.push({ mn: [Math.min(x, x + sx * w), 0, z], mx: [Math.max(x, x + sx * w), 10 + rnd() * 14, z + 20], kind: 0, col: [34, 31, 46], seed: rnd() * 99, p: .15 });
}
// Cathedral of Learning, with its beacon
[[30, 40], [24, 62], [18, 80], [12, 92], [6, 100]].forEach(([w, h]) =>
  boxes.push({ mn: [60 - w / 2, 0, -170 - w / 2], mx: [60 + w / 2, h, -170 + w / 2], kind: 0, col: [44, 40, 56], seed: 5, p: .3 }));
spheres.push({ c: [60, 103, -170], r: 2.4, col: [255, 60, 50], ch: '*', beacon: true });
// Hamerschlag Hall
boxes.push({ mn: [-66, 0, -92], mx: [-42, 20, -78], kind: 0, col: [60, 44, 38], seed: 3, p: .2 });
boxes.push({ mn: [-57, 20, -89], mx: [-51, 33, -83], kind: 0, col: [60, 44, 38], seed: 4, p: .1 });
spheres.push({ c: [-54, 34, -86], r: 3.6, col: [70, 60, 54], ch: '#', fog: true });
// a bus on Forbes
const bus = { mn: [0, .5, -41.3], mx: [0, 3.5, -38.7], kind: 3, col: [64, 96, 128] };
boxes.push(bus);

const stars = [];
for (let i = 0; i < 260; i++) {
  const a = rnd() * 6.283, y = .03 + rnd() * .95, h = Math.sqrt(1 - y * y);
  stars.push({ d: [Math.cos(a) * h, y, Math.sin(a) * h], ph: rnd() * 6.3, f: .4 + rnd() * 1.6, b: .25 + rnd() * .55, c: rnd() < .12 ? '+' : '.' });
}
const SNOW = { x: 90, y: 42, z: 90, x0: -45, z0: -30 }, snow = [];
for (let i = 0; i < 1900; i++) snow.push({
  x: rnd() * SNOW.x, y: rnd() * SNOW.y, z: rnd() * SNOW.z, vy: 1.4 + rnd() * 1.6, vx: -.7 + rnd() * .5,
  a: .2 + rnd() * .6, f: .3 + rnd() * .9, ph: rnd() * 6.3, s: .7 + rnd() * .8, star: rnd() < .07,
});

// ---------- camera ----------
const LAMP0 = () => lamps[0];
const SHOTS = [
  { t0: 0, t1: 2.2, p0: [-7, 9, 44], p1: [-5.5, 9.3, 44.5], g0: [-6.6, 7.6, 3], g1: [-6.6, 7.6, 3], z0: 2.7, z1: 2.55, fov: 50 },
  { t0: 2.2, t1: 5.4, p0: [-5.5, 9.3, 44.5], p1: [-1, 10.5, 50], g0: [-6.6, 7.6, 3], g1: [1.5, 12.2, 0], z0: 2.55, z1: 1, fov: 50 },
  { t0: 5.4, t1: 9.5, p0: [-1, 10.5, 50], p1: [26, 9, 43], g0: [1.5, 12.2, 0], g1: [2.5, 12.2, 0], z0: 1, z1: 1, fov: 50 },
  { t0: 9.5, t1: 13.5, p0: [-14, 1.4, -2], p1: [-11, 1.9, -7], g0: [1.5, 9, 0], g1: [3, 12.5, 0], z0: 1, z1: 1, fov: 66 },
  { t0: 13.5, t1: LOOP, p0: [-9, 26, 23], p1: [15, 30, 20], g0: [5, 19, 0], g1: [5.4, 20.5, 0], z0: 1, z1: 1, fov: 52 },
];
const cam = { p: [0, 0, 0], r: [1, 0, 0], u: [0, 1, 0], f: [0, 0, -1], tv: 1, th: 1, z: 1 };
function setCamera(t) {
  const s = SHOTS.find(s => t < s.t1) || SHOTS[SHOTS.length - 1];
  let u = Math.min(1, Math.max(0, (t - s.t0) / (s.t1 - s.t0))); u = u * u * (3 - 2 * u);
  cam.p = mix(s.p0, s.p1, u);
  cam.f = norm(sub(mix(s.g0, s.g1, u), cam.p));
  cam.r = norm(cross(cam.f, [0, 1, 0])); cam.u = cross(cam.r, cam.f);
  cam.z = Math.exp(Math.log(s.z0) + (Math.log(s.z1) - Math.log(s.z0)) * u);
  cam.tv = Math.tan(s.fov * Math.PI / 360); cam.th = cam.tv * 9 / 16;
}
// world point -> [column, row, depth], or null when behind the camera
function project(p) {
  const x = p[0] - cam.p[0], y = p[1] - cam.p[1], z = p[2] - cam.p[2];
  const zc = x * cam.f[0] + y * cam.f[1] + z * cam.f[2];
  if (zc < .15) return null;
  return [((x * cam.r[0] + y * cam.r[1] + z * cam.r[2]) / (zc * cam.th) + 1) / 2 * GW,
          (1 - (x * cam.u[0] + y * cam.u[1] + z * cam.u[2]) / (zc * cam.tv)) / 2 * GH, zc];
}

// ---------- character framebuffer ----------
const cd = new Float32Array(NC), cr = new Float32Array(NC), cg = new Float32Array(NC), cb = new Float32Array(NC);
const cc = new Array(NC).fill(''), cbg = new Uint8Array(NC);
const rx = new Float32Array(NC), ry = new Float32Array(NC), rz = new Float32Array(NC);
let vi0, vi1, vj0, vj1, flick = 1, warm = 0, T = 0;

// warm light arriving at a point from all lamps
function lampLight(x, y, z) {
  let s = 0;
  for (let k = 0; k < lamps.length; k++) {
    const L = lamps[k], dx = x - L[0], dy = y - L[1], dz = z - L[2];
    s += (k ? 1 : flick) * 2.1 / (1 + (dx * dx + dy * dy + dz * dz) / 26);
  }
  return s;
}
function rayCapsule(ox, oy, oz, dx, dy, dz, c, r) {
  const ax = ox - c.a[0], ay = oy - c.a[1], az = oz - c.a[2];
  const bard = c.bx * dx + c.by * dy + c.bz * dz, baoa = c.bx * ax + c.by * ay + c.bz * az;
  const rdoa = dx * ax + dy * ay + dz * az, oaoa = ax * ax + ay * ay + az * az;
  const a = c.baba - bard * bard, b = c.baba * rdoa - baoa * bard, k = c.baba * oaoa - baoa * baoa - r * r * c.baba;
  let h = b * b - a * k;
  if (h < 0) return -1;
  const t = (-b - Math.sqrt(h)) / a, y = baoa + t * bard;
  if (y > 0 && y < c.baba) return t;
  const ex = y <= 0 ? ax : ox - c.b[0], ey = y <= 0 ? ay : oy - c.b[1], ez = y <= 0 ? az : oz - c.b[2];
  const b2 = dx * ex + dy * ey + dz * ez; h = b2 * b2 - (ex * ex + ey * ey + ez * ez - r * r);
  return h > 0 ? -b2 - Math.sqrt(h) : -1;
}
function shadeSolid(i, t, ch, col, fl, x, y, z) {
  const w = lampLight(x, y, z), k = .12 + fl * (.5 + .08 * Math.sin(T * 1.7 + y * .5));
  cd[i] = t; cc[i] = ch; cbg[i] = 0;
  cr[i] = col[0] * (k + w * 1.25); cg[i] = col[1] * (k + w); cb[i] = col[2] * (k + w * .68);
}
// clamp a cell rectangle to what is on screen; false when nothing is left
let i0, i1, j0, j1;
function clip(a, b, c, d) {
  i0 = Math.max(vi0, Math.floor(a)); i1 = Math.min(vi1, Math.ceil(b)); j0 = Math.max(vj0, Math.floor(c)); j1 = Math.min(vj1, Math.ceil(d));
  return i0 <= i1 && j0 <= j1;
}

const RAMP = ' .-~+*oxX%#';
function render(t) {
  T = t; setCamera(t);
  const C = cam.p, ox = C[0], oy = C[1], oz = C[2], Z = cam.z;
  const pixH = 2 * cam.th / GW, pixV = 2 * cam.tv / GH;
  flick = .93 + .05 * Math.sin(t * 13.7) + .03 * Math.sin(t * 31.3 + 1) - (hash(Math.floor(t * 9), 3) > .96 ? .25 : 0);
  vi0 = Math.max(0, Math.floor(GW / 2 - GW / 2 / Z)); vi1 = Math.min(GW - 1, Math.ceil(GW / 2 + GW / 2 / Z));
  vj0 = Math.max(0, Math.floor(GH / 2 - GH / 2 / Z)); vj1 = Math.min(GH - 1, Math.ceil(GH / 2 + GH / 2 / Z));
  bus.mn[0] = 110 - t / LOOP * 230; bus.mx[0] = bus.mn[0] + 11;
  const L0 = LAMP0();

  // rays, sky and the ground plane
  for (let j = vj0; j <= vj1; j++) for (let i = vi0; i <= vi1; i++) {
    const n = j * GW + i, px = ((i + .5) / GW * 2 - 1) * cam.th, py = (1 - (j + .5) / GH * 2) * cam.tv;
    let dx = cam.f[0] + cam.r[0] * px + cam.u[0] * py, dy = cam.f[1] + cam.r[1] * px + cam.u[1] * py, dz = cam.f[2] + cam.r[2] * px + cam.u[2] * py;
    const l = 1 / Math.sqrt(dx * dx + dy * dy + dz * dz); dx *= l; dy *= l; dz *= l;
    rx[n] = dx; ry[n] = dy; rz[n] = dz; cd[n] = Infinity; cc[n] = ''; cbg[n] = 0;
    if (dy > -1e-4) continue;
    const tg = -oy / dy; if (tg > 420) continue;
    const x = ox + dx * tg, z = oz + dz * tg;
    // snow, the cleared walkway, and Forbes Avenue
    const path = Math.abs(.3 * x + .954 * z - 6) < 1.5, road = z < -35 && z > -45;
    let w = 0;
    for (let k = 0; k < lamps.length; k++) {
      const L = lamps[k], ex = x - L[0], ez = z - L[2], d2 = ex * ex + L[1] * L[1] + ez * ez;
      let s = 2.4 * L[1] / Math.sqrt(d2) / (1 + d2 / 26);
      if (k === 0 && s > .02) {   // shadows from the hero lamp
        const len = Math.sqrt(d2), sx = -ex / len, sy = L[1] / len, sz = -ez / len;
        for (const c of casters) { const ts = rayCapsule(x, .02, z, sx, sy, sz, c, c.r); if (ts > 0 && ts < len) { s *= .12; break; } }
        s *= flick;
      }
      w += s;
    }
    const cool = .9 / (1 + (x * x + z * z) / 7), fog = Math.exp(-tg / 150);
    const alb = path ? .42 : road ? .22 : 1, v = (.075 + w + cool * .8) * alb * fog;
    let ch;
    if (path || road) ch = v > .3 ? '=' : v > .09 ? '-' : v > .03 ? '.' : ' ';
    else ch = RAMP[Math.max(0, Math.min(RAMP.length - 1, Math.floor(v * (RAMP.length - 1) + (hash(i, j) - .5) * 1.3)))];
    cd[n] = tg; cc[n] = ch === ' ' ? '' : ch;
    const a = alb * fog;
    cr[n] = (16 + 235 * w + 150 * cool) * a; cg[n] = (18 + 190 * w + 170 * cool) * a; cb[n] = (30 + 125 * w + 215 * cool) * a;
  }

  // buildings, lamp heads, the bus
  for (const B of boxes) {
    let a = 1e9, b = -1e9, c = 1e9, d = -1e9, behind = 0;
    for (let k = 0; k < 8; k++) {
      const q = project([k & 1 ? B.mx[0] : B.mn[0], k & 2 ? B.mx[1] : B.mn[1], k & 4 ? B.mx[2] : B.mn[2]]);
      if (!q) { behind++; continue; }
      a = Math.min(a, q[0]); b = Math.max(b, q[0]); c = Math.min(c, q[1]); d = Math.max(d, q[1]);
    }
    if (behind === 8) continue;
    if (behind) { a = c = -1e9; b = d = 1e9; }
    if (!clip(a - 1, b, c - 1, d)) continue;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const n = j * GW + i, dx = rx[n], dy = ry[n], dz = rz[n];
      let tn = -1e9, tf = 1e9, ax = 0, t1, t2;
      t1 = (B.mn[0] - ox) / dx; t2 = (B.mx[0] - ox) / dx; if (t1 > t2) { const s = t1; t1 = t2; t2 = s; } if (t1 > tn) { tn = t1; ax = 0; } if (t2 < tf) tf = t2;
      t1 = (B.mn[1] - oy) / dy; t2 = (B.mx[1] - oy) / dy; if (t1 > t2) { const s = t1; t1 = t2; t2 = s; } if (t1 > tn) { tn = t1; ax = 1; } if (t2 < tf) tf = t2;
      t1 = (B.mn[2] - oz) / dz; t2 = (B.mx[2] - oz) / dz; if (t1 > t2) { const s = t1; t1 = t2; t2 = s; } if (t1 > tn) { tn = t1; ax = 2; } if (t2 < tf) tf = t2;
      if (!(tn < tf) || tn <= 0 || tn >= cd[n]) continue;
      const x = ox + dx * tn, y = oy + dy * tn, z = oz + dz * tn, u = ax === 0 ? z : x;
      if (B.kind === 2) {          // lamp lens
        cd[n] = tn; cc[n] = '@'; cbg[n] = 1; cr[n] = B.col[0] * flick; cg[n] = B.col[1] * flick; cb[n] = B.col[2] * flick;
      } else if (B.kind === 1) {   // lamp housing
        shadeSolid(n, tn, '#', B.col, .25, x, y, z);
      } else if (B.kind === 3) {   // bus
        const win = ax !== 1 && y > 1.9 && y < 2.9 && (u / 1.7 - Math.floor(u / 1.7)) > .22;
        if (win) { cd[n] = tn; cc[n] = '='; cbg[n] = 0; cr[n] = 230; cg[n] = 190; cb[n] = 110; }
        else shadeSolid(n, tn, '#', B.col, .5, x, y, z);
      } else {                     // building with lit windows
        const fog = Math.exp(-tn / 330), iu = Math.floor(u / 3), iv = Math.floor(y / 3.4), fu = u / 3 - iu, fv = y / 3.4 - iv;
        const lit = ax !== 1 && fu > .2 && fu < .8 && fv > .25 && fv < .8 && hash(iu + B.seed * 17.3, iv + B.seed) < B.p
          && Math.sin(t * (.1 + hash(iu, iv) * .3) + iu * 7 + iv) > -.8;
        cd[n] = tn; cbg[n] = 0;
        if (lit) { cc[n] = 'o'; cr[n] = 232 * fog; cg[n] = 172 * fog; cb[n] = 82 * fog; }
        else { const k = (ax === 0 ? 1.25 : 1) * fog * (1 + lampLight(x, y, z) * 2); cc[n] = '#'; cr[n] = B.col[0] * k; cg[n] = B.col[1] * k; cb[n] = B.col[2] * k; }
      }
    }
  }

  // pole, limbs, posts and branches
  for (const c of capsules) {
    const A = project(c.a), B = project(c.b);
    if (!A && !B) continue;
    const zc = A && B ? Math.min(A[2], B[2]) : (A || B)[2], re = Math.max(c.r, .55 * pixH * (A && B ? (A[2] + B[2]) / 2 : zc));
    let ch = c.ch;
    if (A && B) {
      const ri = re / (pixH * zc) + 1, rj = re / (pixV * zc) + 1;
      if (!clip(Math.min(A[0], B[0]) - ri, Math.max(A[0], B[0]) + ri, Math.min(A[1], B[1]) - rj, Math.max(A[1], B[1]) + rj)) continue;
      if (!ch) { const sx = (B[0] - A[0]) * CW, sy = (B[1] - A[1]) * CH; ch = Math.abs(sx) < .45 * Math.abs(sy) ? '|' : Math.abs(sy) < .45 * Math.abs(sx) ? '-' : sx * sy > 0 ? '\\' : '/'; }
    } else { clip(-1e9, 1e9, -1e9, 1e9); ch = ch || '|'; }
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const n = j * GW + i, tt = rayCapsule(ox, oy, oz, rx[n], ry[n], rz[n], c, re);
      if (tt > 0 && tt < cd[n]) shadeSolid(n, tt, ch, c.col, c.fl, ox + rx[n] * tt, oy + ry[n] * tt, oz + rz[n] * tt);
    }
  }

  // heads, the beacon, the cupola
  for (const s of spheres) {
    const q = project(s.c); if (!q) continue;
    const re = Math.max(s.r, .55 * pixH * q[2]), ri = re / (pixH * q[2]) + 1, rj = re / (pixV * q[2]) + 1;
    if (!clip(q[0] - ri, q[0] + ri, q[1] - rj, q[1] + rj)) continue;
    const ex = ox - s.c[0], ey = oy - s.c[1], ez = oz - s.c[2], k = ex * ex + ey * ey + ez * ez - re * re;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const n = j * GW + i, b = rx[n] * ex + ry[n] * ey + rz[n] * ez, h = b * b - k;
      if (h < 0) continue;
      const tt = -b - Math.sqrt(h); if (tt <= 0 || tt >= cd[n]) continue;
      if (s.beacon) { const on = Math.sin(t * 3.3) > .2 ? 1 : .15; cd[n] = tt; cc[n] = s.ch; cbg[n] = 0; cr[n] = s.col[0] * on; cg[n] = s.col[1] * on; cb[n] = s.col[2] * on; }
      else if (s.fog) { const f = Math.exp(-tt / 330); cd[n] = tt; cc[n] = s.ch; cbg[n] = 0; cr[n] = s.col[0] * f; cg[n] = s.col[1] * f; cb[n] = s.col[2] * f; }
      else shadeSolid(n, tt, s.ch, s.col, s.fl, ox + rx[n] * tt, oy + ry[n] * tt, oz + rz[n] * tt);
    }
  }

  // light hanging in the air around each lamp
  for (let k = 0; k < lamps.length; k++) {
    const L = lamps[k], q = project(L); if (!q) continue;
    const vx = L[0] - ox, vy = L[1] - oy, vz = L[2] - oz, vv = vx * vx + vy * vy + vz * vz;
    const R = 9, ri = R / (pixH * q[2]) + 1, rj = R / (pixV * q[2]) + 1;
    if (!clip(q[0] - ri, q[0] + ri, q[1] - rj, q[1] + rj)) continue;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const n = j * GW + i; if (cc[n] && cc[n] !== '.') continue;
      const tp = vx * rx[n] + vy * ry[n] + vz * rz[n]; if (tp < 0 || cd[n] < tp) continue;
      const g = (k ? 1 : flick) / (1 + (vv - tp * tp) / 3.2); if (g < .055) continue;
      const b = Math.min(1, g * 1.5) * (.75 + .25 * hash(i + Math.floor(t * 6), j));
      if (cc[n] === '.' && cr[n] > 235 * b) continue;
      cc[n] = '.'; cr[n] = 235 * b; cg[n] = 180 * b; cb[n] = 96 * b;
    }
  }
  for (const s of stars) {
    const q = project(add(C, s.d, 100)); if (!q) continue;
    const i = Math.floor(q[0]), j = Math.floor(q[1]);
    if (i < vi0 || i > vi1 || j < vj0 || j > vj1) continue;
    const n = j * GW + i; if (cc[n] || cd[n] < Infinity) continue;
    const b = s.b * (.6 + .4 * Math.sin(t * s.f + s.ph));
    cc[n] = s.c; cr[n] = 150 * b; cg[n] = 165 * b; cb[n] = 210 * b;
  }
}

// ---------- drawing ----------
const styleCache = new Map();
function style(r, g, b) {
  r = r > 255 ? 255 : r < 0 ? 0 : r | 0; g = g > 255 ? 255 : g < 0 ? 0 : g | 0; b = b > 255 ? 255 : b < 0 ? 0 : b | 0;
  const k = (r >> 3) << 10 | (g >> 3) << 5 | (b >> 3);
  let s = styleCache.get(k);
  if (!s) { s = `rgb(${r & 248},${g & 248},${b & 248})`; styleCache.set(k, s); }
  return s;
}
const FONT = 'ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace';
function frame(t, clock) {
  render(t);
  const Z = cam.z, cw = CW * Z, ch = CH * Z;
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#02030a'); sky.addColorStop(1, '#070812');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${ch * .95}px ${FONT}`;
  for (let j = vj0; j <= vj1; j++) for (let i = vi0; i <= vi1; i++) {
    const n = j * GW + i; if (!cc[n]) continue;
    const X = W / 2 + (i + .5 - GW / 2) * cw, Y = H / 2 + (j + .5 - GH / 2) * ch;
    if (cbg[n]) { ctx.fillStyle = style(cr[n] * .42, cg[n] * .36, cb[n] * .3); ctx.fillRect(X - cw / 2, Y - ch / 2, cw + 1, ch + 1); }
    ctx.fillStyle = style(cr[n], cg[n], cb[n]);
    ctx.fillText(cc[n], X, Y);
  }

  // snow lives in the 3D scene: it is depth tested against the characters and lit by the lamps
  const C = cam.p;
  for (const p of snow) {
    const y = SNOW.y - (((p.y + p.vy * clock) % SNOW.y) + SNOW.y) % SNOW.y;
    const x = SNOW.x0 + (((p.x + p.vx * clock + Math.sin(clock * p.f + p.ph) * p.a) % SNOW.x) + SNOW.x) % SNOW.x;
    const z = SNOW.z0 + p.z, q = project([x, y, z]); if (!q) continue;
    const i = Math.floor(q[0]), j = Math.floor(q[1]);
    if (i < vi0 || i > vi1 || j < vj0 || j > vj1) continue;
    const dist = Math.hypot(x - C[0], y - C[1], z - C[2]);
    if (dist > cd[j * GW + i]) continue;
    const w = lampLight(x, y, z), k = Math.min(1.25, .45 + .25 * p.s + w * .9) * Math.min(1, 14 / dist + .35);
    const X = W / 2 + (q[0] - GW / 2) * cw, Y = H / 2 + (q[1] - GH / 2) * ch;
    ctx.fillStyle = style(215 * k + 50 * w, 215 * k + 15 * w, 225 * k - 35 * w);
    if (p.star && dist < 30) {
      ctx.font = `${Math.min(ch * 2.4, Math.max(ch * .9, ch * 22 / dist))}px ${FONT}`;
      ctx.fillText('*', X, Y);
    } else {
      ctx.beginPath(); ctx.arc(X, Y, Math.min(ch * .6, Math.max(ch * .085, ch * 2.6 * p.s / dist)), 0, 6.2832); ctx.fill();
    }
  }

  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.85)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(0, 1 - Math.min(t, LOOP - t) / .45);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

const start = performance.now();
function tick(now) {
  const clock = (now - start) / 1000;
  if (FREEZE !== null) frame(FREEZE, FREEZE);
  else { frame(clock % LOOP, clock); requestAnimationFrame(tick); }
}
requestAnimationFrame(tick);
</script>
</body>
