<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walking to the Sky in ASCII</title>
<meta name="description" content="A night walk up to Walking to the Sky at Carnegie Mellon, converted to ASCII.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  footer {
    position: fixed; left: 0; right: 0; bottom: 6px; text-align: center;
    font: 11px ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    color: #3a3a44; pointer-events: none;
  }
  footer a { color: #55556a; pointer-events: auto; text-decoration: none; }
</style>
</head>
<body>
<video id="v" src="statue.mp4" muted loop playsinline autoplay preload="auto"></video>
<canvas id="c"></canvas>
<footer>Walking to the Sky, CMU &middot; after <a href="https://www.instagram.com/reels/DeLB9wtxJYI/">@ascii_and_pixels</a> &middot; <a href="3d.html">3D version</a></footer>
<script>
'use strict';
// Plays statue.mp4 as characters: each frame is shrunk to a GW x GH grid, and every cell
// becomes one glyph chosen by brightness (or by edge direction along strong outlines).
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), video = document.getElementById('v');
const GW = 100, GH = 110, NC = GW * GH;
const params = new URLSearchParams(location.search);
const FREEZE = params.has('t') ? parseFloat(params.get('t')) : null;

let W, H, CW, CH;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let h = innerHeight, w = h * 9 / 16;
  if (w > innerWidth) { w = innerWidth; h = w * 16 / 9; }
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  W = cv.width = Math.round(w * dpr); H = cv.height = Math.round(h * dpr);
  CW = W / GW; CH = H / GH;
}
addEventListener('resize', resize); resize();

const small = document.createElement('canvas'); small.width = GW; small.height = GH;
const sctx = small.getContext('2d', { willReadFrequently: true });
const sr = new Float32Array(NC), sg = new Float32Array(NC), sb = new Float32Array(NC), lum = new Float32Array(NC);
let primed = false;

const styleCache = new Map();
function style(r, g, b) {
  r = r > 255 ? 255 : r < 0 ? 0 : r | 0; g = g > 255 ? 255 : g < 0 ? 0 : g | 0; b = b > 255 ? 255 : b < 0 ? 0 : b | 0;
  const k = (r >> 3) << 10 | (g >> 3) << 5 | (b >> 3);
  let s = styleCache.get(k);
  if (!s) { s = `rgb(${r & 248},${g & 248},${b & 248})`; styleCache.set(k, s); }
  return s;
}
const RAMP = '  .:-~+*oxX%##';
const FONT = 'ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace';
// the reel opens tight on the lamp, then pulls back
const FOCUS = [.24, .13], ZOOM = 2.5, HOLD = 1.1, PULL = 2.9;

function frame() {
  const t = video.currentTime;
  sctx.drawImage(video, 0, 0, GW, GH);
  const d = sctx.getImageData(0, 0, GW, GH).data;
  // a little temporal smoothing keeps night-time sensor noise from making the glyphs boil
  const keep = primed ? .45 : 0;
  for (let n = 0, k = 0; n < NC; n++, k += 4) {
    sr[n] = sr[n] * keep + d[k] * (1 - keep); sg[n] = sg[n] * keep + d[k + 1] * (1 - keep); sb[n] = sb[n] * keep + d[k + 2] * (1 - keep);
    const l = (.299 * sr[n] + .587 * sg[n] + .114 * sb[n]) / 255;
    lum[n] = Math.pow(Math.min(1, Math.max(0, (l - .03) / .62)), .85);
  }
  primed = true;

  let u = Math.min(1, Math.max(0, (t - HOLD) / (PULL - HOLD))); u = u * u * (3 - 2 * u);
  const Z = Math.exp(Math.log(ZOOM) * (1 - u));
  // keep the focus point on screen while zoomed, sliding back to centre as the zoom releases
  const fx = .5 + (FOCUS[0] - .5) * (1 - u), fy = .5 + (FOCUS[1] - .5) * (1 - u);
  const cx = Math.min(GW - GW / 2 / Z, Math.max(GW / 2 / Z, fx * GW)), cy = Math.min(GH - GH / 2 / Z, Math.max(GH / 2 / Z, fy * GH));
  const cw = CW * Z, ch = CH * Z;
  const i0 = Math.max(0, Math.floor(cx - GW / 2 / Z)), i1 = Math.min(GW - 1, Math.ceil(cx + GW / 2 / Z));
  const j0 = Math.max(0, Math.floor(cy - GH / 2 / Z)), j1 = Math.min(GH - 1, Math.ceil(cy + GH / 2 / Z));

  ctx.fillStyle = '#03040a'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${ch * .95}px ${FONT}`;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const n = j * GW + i, l = lum[n];
    if (l < .07) continue;
    const X = W / 2 + (i + .5 - cx) * cw, Y = H / 2 + (j + .5 - cy) * ch;
    const m = Math.max(sr[n], sg[n], sb[n], 1), lo = Math.min(sr[n], sg[n], sb[n]) * .35, k = (.3 + .7 * l) * 255 / (m - lo);
    const r = (sr[n] - lo) * k, g = (sg[n] - lo) * k, b = (sb[n] - lo) * k;   // pull out the grey to deepen colour
    let c;
    if (l > .93) {              // blown-out lights get a solid block, like the lamp in the reel
      c = '@'; ctx.fillStyle = style(r * .45, g * .4, b * .32); ctx.fillRect(X - cw / 2, Y - ch / 2, cw + 1, ch + 1);
    } else {
      c = RAMP[Math.min(RAMP.length - 1, Math.floor(l * RAMP.length))];
      if (i > 0 && j > 0 && i < GW - 1 && j < GH - 1) {   // outline glyphs follow the edge direction
        const gx = lum[n - GW + 1] + 2 * lum[n + 1] + lum[n + GW + 1] - lum[n - GW - 1] - 2 * lum[n - 1] - lum[n + GW - 1];
        const gy = lum[n + GW - 1] + 2 * lum[n + GW] + lum[n + GW + 1] - lum[n - GW - 1] - 2 * lum[n - GW] - lum[n - GW + 1];
        if (gx * gx + gy * gy > 1.1 && l > .2) {
          const ax = Math.abs(gx), ay = Math.abs(gy);
          c = ax > 2.2 * ay ? '|' : ay > 2.2 * ax ? '-' : gx * gy > 0 ? '/' : '\\';
        }
      }
    }
    ctx.fillStyle = style(r, g, b);
    ctx.fillText(c, X, Y);
  }

  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.8)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(0, 1 - Math.min(t, (video.duration || 1e9) - t) / .3);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

if (FREEZE !== null) {
  video.autoplay = false; video.pause();
  video.addEventListener('seeked', () => { frame(); document.documentElement.dataset.ready = '1'; });
  const seek = () => { video.currentTime = FREEZE; };
  video.readyState >= 1 ? seek() : video.addEventListener('loadedmetadata', seek);
} else {
  const loop = () => { if (video.readyState >= 2) frame(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  // autoplay can be refused until the first tap
  const kick = () => video.play().catch(() => {});
  kick(); addEventListener('pointerdown', kick); addEventListener('keydown', kick);
}
</script>
</body>
</html>
